<div class="social-links">
{% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">GitHub ↗</a>{% endif %}
{% if site.mastodon_username %}<a rel="me" href="https://{{ site.mastodon_instance }}/@{{ site.mastodon_username }}">Mastodon ↗</a>{% endif %}
{% unless include.compact %}
{% if site.linkedin_link %}<a href="{{ site.linkedin_link }}">LinkedIn ↗</a>{% endif %}
{% if site.twitter_username %}<a href="https://twitter.com/{{ site.twitter_username }}">Twitter ↗</a>{% endif %}
{% endunless %}
<a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
</div>
