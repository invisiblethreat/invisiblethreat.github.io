<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.excerpt | default: site.title_description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
{% if page.preview %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<script>/* Apply preview before paint; the configured theme also works without JavaScript. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(['fieldnotes','signal','quiet'].indexOf(t)!==-1)document.documentElement.dataset.theme=t;})();</script>
<link rel="stylesheet" href="{{ '/assets/theme.css' | relative_url }}">
<link rel="icon" href="{{ '/favicons/favicon-32x32.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/favicons/apple-touch-icon.png' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<meta name="theme-color" content="#2D2D29">
</head>
